<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>samplevis · preset gallery &amp; visual templates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      overflow-y: auto !important;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .gallery-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 36px 24px 64px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      box-shadow: inset 0 -1px 0 rgb(255 255 255 / 0.5);
    }

    .gallery-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .gallery-title {
      font-family: var(--font-brand);
      font-weight: 600;
      font-size: 24px;
      letter-spacing: -0.02em;
      color: var(--ink-loud);
    }

    .gallery-subtitle {
      font-size: 13px;
      color: var(--ink-muted);
    }

    .gallery-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gallery-tabs {
      display: flex;
      gap: 4px;
      background: var(--fill-subtle);
      padding: 3px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-field);
      width: fit-content;
    }

    .gallery-tab-btn {
      background: transparent;
      border: none;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-muted);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-standard);
    }

    .gallery-tab-btn:hover {
      color: var(--ink-loud);
    }

    .gallery-tab-btn.active {
      background: var(--surface);
      color: var(--ink-loud);
      font-weight: 500;
      box-shadow: var(--shadow-raised);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .gallery-card {
      position: relative;
      background: var(--surface-glass);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-raised);
      transition:
        transform var(--dur-base) var(--ease-out),
        box-shadow var(--dur-base) var(--ease-out),
        border-color var(--dur-fast) var(--ease-standard);
      text-decoration: none;
      color: inherit;
    }

    .gallery-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-float);
      border-color: var(--line-hover);
    }

    .gallery-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gallery-card-title {
      font-family: var(--font-brand);
      font-weight: 600;
      font-size: 17px;
      color: var(--ink-loud);
      letter-spacing: -0.01em;
    }

    .gallery-card-badge {
      font-family: var(--font-mono);
      font-size: 9.5px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent-ink);
      border: 1px solid var(--accent-ring);
    }

    .gallery-card-desc {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--ink-muted);
      flex: 1;
    }

    .gallery-card-preview {
      width: 100%;
      height: 140px;
      background: var(--stage-bg);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1);
    }

    .preview-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      font-family: var(--font-mono);
      font-size: 10.5px;
    }

    .gallery-card-btn {
      color: var(--accent-ink);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .card-meta-tag {
      color: var(--ink-faint);
    }

    .new-preset-card {
      border: 1px dashed var(--line-strong);
      background: var(--surface-raised);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 280px;
      cursor: pointer;
    }

    .new-preset-card:hover {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: var(--shadow-raised-hover), 0 0 0 4px var(--accent-soft);
    }

    .new-preset-icon {
      font-size: 32px;
      color: var(--accent-ink);
      margin-bottom: 12px;
      line-height: 1;
    }

    .new-preset-title {
      font-family: var(--font-brand);
      font-size: 16px;
      font-weight: 600;
      color: var(--ink-loud);
      margin-bottom: 4px;
    }

    .new-preset-desc {
      font-size: 12px;
      color: var(--ink-muted);
      max-width: 220px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <!-- ambient backdrop -->
  <div class="ambient-orb ambient-orb-1" aria-hidden="true"></div>
  <div class="ambient-orb ambient-orb-2" aria-hidden="true"></div>
  <div class="ambient-orb ambient-orb-3" aria-hidden="true"></div>

  <!-- top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <a href="/" class="brand-mark">samplevis</a>
      <span class="topbar-subtitle">preset gallery</span>
    </div>
    <div class="topbar-right">
      <a href="/" class="btn btn-secondary btn-sm" target="_blank">
        open studio ↗
      </a>
    </div>
  </header>

  <main class="gallery-container">
    <header class="gallery-header">
      <div class="gallery-title-wrap">
        <h1 class="gallery-title">visual presets &amp; styles</h1>
        <p class="gallery-subtitle">select an official visualizer template or continue working on your saved presets.</p>
      </div>
      <div class="gallery-actions">
        <div class="gallery-tabs">
          <button type="button" class="gallery-tab-btn active" data-filter="all">all</button>
          <button type="button" class="gallery-tab-btn" data-filter="templates">official templates</button>
          <button type="button" class="gallery-tab-btn" data-filter="saved">saved projects</button>
        </div>
      </div>
    </header>

    <div class="gallery-grid" id="galleryGrid">
      <!-- populated dynamically -->
    </div>
  </main>

  <script src="/js/engine/reelEngine.js"></script>
  <script src="/js/presets/starterPresets.js"></script>
  <script src="/js/services/storageAdapter.js"></script>
  <script src="/js/services/presetService.js"></script>
  <script src="/js/templates/templateRegistry.js"></script>
  <script src="/js/templates/constellationsTemplate.js"></script>
  <script src="/js/templates/cinematicMinimalTemplate.js"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
